<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="t d">
  <title id="t">TriageAI data split and leakage controls</title>
  <desc id="d">The pinned Hugging Face dataset is de-duplicated to 40,167 tickets, shuffled with seed 42 and split 80/20. The first 32,133 tickets form the knowledge base, which feeds the Redis index and classifier training; its last 10% tunes calibration and thresholds. The last 8,034 tickets are the holdout: inputs only go to inference, labels without answers are read only by the evaluator. Holdout macro-F1: type 0.894, priority 0.704, queue 0.639.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#101a2f"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1c2840"/>
    </pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="a-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      .h { font-size: 15px; font-weight: 700; fill: #f1f5f9; }
      .s { font-size: 12px; fill: #cbd5e1; }
      .m { font-size: 11.5px; fill: #8b9bb4; }
      .lbl { font-size: 10.5px; fill: #8b9bb4; }
      .card { fill: #131c31; stroke: #26334f; stroke-width: 1; }
    </style>
  </defs>

  <rect width="960" height="740" rx="22" fill="url(#bg)"/>
  <rect width="960" height="740" rx="22" fill="url(#dots)" opacity="0.7"/>
  <circle cx="230" cy="400" r="200" fill="#2dd4bf" opacity="0.04"/>
  <circle cx="730" cy="400" r="200" fill="#fb7185" opacity="0.035"/>

  <text x="40" y="46" font-size="12" font-weight="700" letter-spacing="3" fill="#2dd4bf">DATA SPLIT + LEAKAGE CONTROLS</text>
  <text x="40" y="76" font-size="23" font-weight="700" fill="#f8fafc">The holdout never reaches training or the index</text>

  <!-- row 1 -->
  <rect x="40" y="104" width="420" height="84" rx="12" class="card"/>
  <rect x="40" y="104" width="4" height="84" rx="2" fill="#94a3b8"/>
  <text x="62" y="134" class="h">Hugging Face dataset</text>
  <text x="62" y="155" class="mono" font-size="11.5" fill="#cbd5e1">Tobi-Bueck/customer-support-tickets</text>
  <text x="62" y="174" class="m">pinned revision · primary + 20k file · de-duplicated</text>

  <line x1="462" y1="146" x2="496" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <rect x="500" y="104" width="420" height="84" rx="12" class="card"/>
  <rect x="500" y="104" width="4" height="84" rx="2" fill="#a78bfa"/>
  <text x="522" y="134" class="h">Locked 80 / 20 split</text>
  <text x="900" y="134" text-anchor="end" font-size="20" font-weight="800" fill="#c4b5fd">40,167</text>
  <text x="522" y="155" class="mono" font-size="11.5" fill="#cbd5e1">sample(frac=1.0, random_state=42)</text>
  <text x="522" y="174" class="m">IDs TKT-00000 … TKT-40166 · first 80% = KB</text>

  <!-- fan out -->
  <path d="M710,190 V212 H250 V228" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="212" x2="710" y2="228" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- row 2: KB | holdout -->
  <rect x="40" y="232" width="420" height="90" rx="12" fill="#2dd4bf" fill-opacity="0.07" stroke="#2dd4bf" stroke-opacity="0.55"/>
  <text x="62" y="263" class="h">Knowledge base</text>
  <text x="440" y="265" text-anchor="end" font-size="24" font-weight="800" fill="#5eead4">32,133</text>
  <text x="62" y="285" class="mono" font-size="11.5" fill="#cbd5e1">TKT-00000 – TKT-32132</text>
  <text x="62" y="305" class="m">last 10% (3,214) = kb_val: calibration + thresholds</text>

  <rect x="500" y="232" width="420" height="90" rx="12" fill="#fb7185" fill-opacity="0.07" stroke="#fb7185" stroke-opacity="0.55"/>
  <text x="522" y="263" class="h">Holdout</text>
  <text x="900" y="265" text-anchor="end" font-size="24" font-weight="800" fill="#fda4af">8,034</text>
  <text x="522" y="285" class="mono" font-size="11.5" fill="#cbd5e1">TKT-32133 – TKT-40166</text>
  <text x="522" y="305" class="m">never trained on, never indexed, scored once</text>

  <!-- leakage wall -->
  <line x1="480" y1="232" x2="480" y2="470" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 5" stroke-opacity="0.8"/>
  <rect x="424" y="330" width="112" height="22" rx="11" fill="#1c1a12" stroke="#fbbf24" stroke-opacity="0.7"/>
  <text x="480" y="345" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.5" fill="#fcd34d">NO OVERLAP</text>

  <!-- KB children -->
  <line x1="140" y1="324" x2="140" y2="356" stroke="#2dd4bf" stroke-width="2" marker-end="url(#a-teal)"/>
  <line x1="360" y1="324" x2="360" y2="356" stroke="#2dd4bf" stroke-width="2" marker-end="url(#a-teal)"/>
  <rect x="40" y="360" width="200" height="104" rx="12" class="card"/>
  <rect x="40" y="360" width="4" height="104" rx="2" fill="#f87171"/>
  <text x="58" y="388" class="h">Redis index</text>
  <text x="58" y="410" class="s">answers from the KB only</text>
  <text x="58" y="428" class="m">+ 10,542 German topic</text>
  <text x="58" y="445" class="m">rows, without answers</text>

  <rect x="260" y="360" width="200" height="104" rx="12" class="card"/>
  <rect x="260" y="360" width="4" height="104" rx="2" fill="#38bdf8"/>
  <text x="278" y="388" class="h">Classifier training</text>
  <text x="278" y="410" class="s">TF-IDF + LR per head</text>
  <text x="278" y="428" class="m">temperature-calibrated</text>
  <text x="278" y="445" class="m">on kb_val</text>

  <!-- holdout children -->
  <line x1="600" y1="324" x2="600" y2="356" stroke="#fb7185" stroke-width="2" marker-end="url(#a-rose)"/>
  <line x1="820" y1="324" x2="820" y2="356" stroke="#fb7185" stroke-width="2" marker-end="url(#a-rose)"/>
  <rect x="500" y="360" width="200" height="104" rx="12" class="card"/>
  <rect x="500" y="360" width="4" height="104" rx="2" fill="#fb7185"/>
  <text x="518" y="388" class="mono" font-size="13" font-weight="700" fill="#f1f5f9">test_inputs.csv</text>
  <text x="518" y="410" class="s">ticket_id, subject, body</text>
  <text x="518" y="428" class="m">all that inference</text>
  <text x="518" y="445" class="m">is allowed to see</text>

  <rect x="720" y="360" width="200" height="104" rx="12" class="card"/>
  <rect x="720" y="360" width="4" height="104" rx="2" fill="#fb7185"/>
  <text x="738" y="388" class="mono" font-size="13" font-weight="700" fill="#f1f5f9">test_labels.csv</text>
  <text x="738" y="410" class="s">labels, answer dropped</text>
  <text x="738" y="428" class="m">read only by</text>
  <text x="738" y="445" class="mono" font-size="11" fill="#8b9bb4">ml/evaluate.py</text>

  <!-- into the report -->
  <line x1="250" y1="466" x2="250" y2="512" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="260" y="494" class="lbl">model + index</text>
  <line x1="600" y1="466" x2="600" y2="512" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="610" y="494" class="lbl">predictions</text>
  <line x1="820" y1="466" x2="820" y2="512" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="830" y="494" class="lbl">ground truth</text>

  <!-- report -->
  <rect x="40" y="516" width="880" height="160" rx="14" fill="#0f1b2e" stroke="#1f5552" stroke-width="1.2"/>
  <text x="62" y="546" class="h">Holdout report</text>
  <text x="182" y="546" class="m">macro-F1 on 8,034 unseen tickets · classifier + neighbour vote</text>
  <text x="900" y="546" text-anchor="end" class="lbl">classifier alone</text>

  <text x="62" y="583" class="s">Type</text>
  <text x="62" y="598" class="lbl">4 classes</text>
  <rect x="170" y="574" width="560" height="14" rx="7" fill="#1c2840"/>
  <rect x="170" y="574" width="500.6" height="14" rx="7" fill="url(#bar)"/>
  <text x="742" y="586" font-size="15" font-weight="800" fill="#f1f5f9">0.894</text>
  <text x="900" y="586" text-anchor="end" class="m">0.859</text>

  <text x="62" y="619" class="s">Priority</text>
  <text x="62" y="634" class="lbl">3 classes</text>
  <rect x="170" y="610" width="560" height="14" rx="7" fill="#1c2840"/>
  <rect x="170" y="610" width="394.2" height="14" rx="7" fill="url(#bar)"/>
  <text x="742" y="622" font-size="15" font-weight="800" fill="#f1f5f9">0.704</text>
  <text x="900" y="622" text-anchor="end" class="m">0.592</text>

  <text x="62" y="655" class="s">Queue</text>
  <text x="62" y="670" class="lbl">10 classes</text>
  <rect x="170" y="646" width="560" height="14" rx="7" fill="#1c2840"/>
  <rect x="170" y="646" width="357.8" height="14" rx="7" fill="url(#bar)"/>
  <text x="742" y="658" font-size="15" font-weight="800" fill="#f1f5f9">0.639</text>
  <text x="900" y="658" text-anchor="end" class="m">0.528</text>

  <!-- footer -->
  <rect x="40" y="698" width="176" height="22" rx="11" fill="#2dd4bf" fill-opacity="0.12"/>
  <text x="128" y="713" text-anchor="middle" font-size="10.5" font-weight="700" fill="#5eead4">leakage audit · 7 / 7 checks</text>
  <text x="232" y="713" class="lbl">qa/audit_leakage.py · split hashes in split_manifest.json</text>
  <text x="920" y="713" text-anchor="end" class="lbl">seed 42 · revision ddf1c81</text>
</svg>
