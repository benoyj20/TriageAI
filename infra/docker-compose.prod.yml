# Production stack on the EC2 box: Caddy (HTTPS) -> Go gateway -> Python engine -> Redis.
# Only Caddy is public (80/443). The console runs on Vercel and proxies /api/* here.
#
#   docker compose --env-file .env -f infra/docker-compose.prod.yml up -d --build
name: sentineldesk

services:
  redis:
    image: redis/redis-stack-server:7.4.0-v8
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --save 300 1"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 60

  engine:
    build:
      context: ..
      dockerfile: infra/Dockerfile.engine
    restart: unless-stopped
    env_file: ../.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ARTIFACT_CACHE: /cache
    volumes:
      - artifact-cache:/cache
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gateway
    restart: unless-stopped
    environment:
      PORT: "8080"
      ENGINE_URL: http://engine:8000
      MOCK_ENGINE: ${MOCK_ENGINE:-false}
      TRUST_PROXY: "true"
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-60}
    depends_on:
      engine:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env, e.g. api.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway

volumes:
  redis-data:
  artifact-cache:
  caddy-data:
  caddy-config:
