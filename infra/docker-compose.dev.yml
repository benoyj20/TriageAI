# Local Redis with the Query Engine (vector search) and RedisInsight. Task H-04.
#
# Run from the repo root, after copying infra/env.template to .env:
#   docker compose --env-file .env -f infra/docker-compose.dev.yml up -d
#
# Redis:        localhost:6379 (password from REDIS_PASSWORD, localhost only)
# RedisInsight: http://localhost:8001
name: sentineldesk-dev

services:
  redis:
    image: redis/redis-stack:7.4.0-v8
    container_name: sentineldesk-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      # Snapshot to /data every 5 minutes when anything changed.
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD} --save 300 1"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis-data:
